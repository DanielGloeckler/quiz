<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktives Schul-Quiz: Physik - Blatt 1</title>
  
  <!-- MathJax für LaTeX Formeln -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #16a34a;
      --error: #dc2626;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid rgba(203, 213, 225, 0.6);
      padding: 35px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      max-width: 650px;
      width: 100%;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .score-badge {
      background: #e0e7ff;
      color: #3730a3;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }

    .progress-bar-container {
      background: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 25px;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #6366f1);
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 5px;
    }

    h2 {
      font-size: 1.35rem;
      margin-bottom: 22px;
      line-height: 1.5;
      color: var(--text-main);
      font-weight: 700;
    }

    .options-grid {
      display: grid;
      gap: 12px;
    }

    .btn-option {
      background: #f8fafc;
      border: 2px solid var(--border-color);
      color: var(--text-main);
      padding: 15px 18px;
      font-size: 1rem;
      text-align: left;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .btn-option:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .btn-option.correct {
      background: #f0fdf4 !important;
      border-color: var(--success) !important;
      color: #166534;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(22, 163, 74, 0.15);
    }

    .btn-option.wrong {
      background: #fef2f2 !important;
      border-color: var(--error) !important;
      color: #991b1b;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.15);
    }

    .feedback-box {
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #f8fafc;
      display: none;
      line-height: 1.6;
      font-size: 0.95rem;
      border-left: 5px solid var(--border-color);
      animation: fadeIn 0.3s ease-out;
    }

    .next-btn {
      margin-top: 22px;
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .next-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .result-box {
      text-align: center;
      display: none;
      animation: fadeIn 0.5s ease-out;
    }
    
    .badge {
      font-size: 4.5rem;
      margin-bottom: 15px;
    }
    
    .rank-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    
    .score-text {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <div id="quiz-screen">
      <div class="header-info">
        <span id="meta">Aufgabe 1 von 8</span>
        <span id="score-badge" class="score-badge">Punkte: 0</span>
      </div>
      
      <div class="progress-bar-container">
        <div id="progress" class="progress-bar"></div>
      </div>

      <h2 id="question-text">Lade Fragen...</h2>
      
      <div id="options-container" class="options-grid"></div>
      
      <div id="feedback" class="feedback-box"></div>
      <button id="next-btn" class="next-btn" onclick="nextQuestion()">Nächste Aufgabe →</button>
    </div>

    <!-- Ergebnis-Bildschirm -->
    <div id="result-screen" class="result-box">
      <div id="badge-icon" class="badge">🎓</div>
      <div id="rank-display" class="rank-title">Laden...</div>
      <p id="score-display" class="score-text"></p>
      <button class="next-btn" style="display:inline-block;" onclick="location.reload()">Quiz wiederholen 🔄</button>
    </div>
  </div>

  <script>
    const quizData = [
      {
        "question": "Was besagt das 1. Newtonsche Gesetz (Trägheitssatz)?",
        "options": [
          "Kräfte treten immer paarweise auf.",
          "Ein Körper bleibt in Ruhe oder in gleichförmiger geradliniger Bewegung, solange keine äußere Kraft auf ihn wirkt.",
          "Kraft ist gleich Masse mal Beschleunigung ($F = m \\cdot a$).",
          "Leichte Körper fallen im Vakuum schneller als schwere."
        ],
        "correct": 1,
        "explanation": "Das Trägheitsprinzip besagt, dass Körper von sich aus ihren Bewegungszustand beibehalten und eine Kraft eine Änderung erzwingen muss."
      },
      {
        "question": "Wie lautet die Formel für die Gewichtskraft auf der Erde?",
        "options": [
          "$F_G = m \\cdot g$",
          "$F_G = \\frac{1}{2} m v^2$",
          "$F_G = m \\cdot a^2$",
          "$F_G = \\frac{m}{g}$"
        ],
        "correct": 0,
        "explanation": "Die Gewichtskraft berechnet sich aus der Masse $m$ multipliziert mit der Erdbeschleunigung $g$ (ca. $9{,}81\\,\\text{m/s}^2$)."
      },
      {
        "question": "Welche Einheit hat die elektrische Spannung?",
        "options": [
          "Ampere (A)",
          "Watt (W)",
          "Volt (V)",
          "Ohm (\\(\\Omega\\))"
        ],
        "correct": 2,
        "explanation": "Die elektrische Spannung $U$ wird in Volt (V) gemessen. Ampere misst den Strom, Ohm den Widerstand und Watt die Leistung."
      },
      {
        "question": "Was beschreibt das Ohmsche Gesetz?",
        "options": [
          "$R = U \\cdot I$",
          "$U = R \\cdot I$",
          "$I = \\frac{R}{U}$",
          "$P = U \\cdot R$"
        ],
        "correct": 1,
        "explanation": "Das Ohmsche Gesetz lautet $U = R \\cdot I$ (Spannung ist Widerstand mal Stromstärke)."
      },
      {
        "question": "Was passiert mit der Fallgeschwindigkeit eines Körpers im Vakuum nach doppelter Fallzeit?",
        "options": [
          "Sie verdoppelt sich.",
          "Sie verdreifacht sich.",
          "Sie vervierfacht sich.",
          "Sie bleibt konstant."
        ],
        "correct": 0,
        "explanation": "Da der freie Fall eine gleichmäßig beschleunigte Bewegung ist ($v = g \\cdot t$), ist die Geschwindigkeit direkt proportional zur Zeit."
      },
      {
        "question": "Welche Energieform besitzt ein Körper in einer bestimmten Höhe über dem Erdboden?",
        "options": [
          "Kinetische Energie (Bewegungsenergie)",
          "Lageenergie (potentielle Energie)",
          "Wärmeenergie",
          "Elektrische Energie"
        ],
        "correct": 1,
        "explanation": "Die Lageenergie ($E_{pot} = m \\cdot g \\cdot h$) hängt von der Masse, der Erdbeschleunigung und der Höhe ab."
      },
      {
        "question": "Warum breitet sich Schall im Vakuum (z.B. im Weltall) nicht aus?",
        "options": [
          "Weil es dort zu kalt ist.",
          "Weil Schallwellen Trägermaterial (Teilchen) zur Ausbreitung benötigen.",
          "Weil die Schwerkraft fehlt.",
          "Weil Lichtwellen den Schall überlagern."
        ],
        "correct": 1,
        "explanation": "Schall ist eine mechanische Welle, die auf schwingende Atome oder Moleküle angewiesen ist. Im Vakuum gibt es keine Teilchen."
      },
      {
        "question": "Welcher physikalische Satz besagt, dass Energie weder erzeugt noch vernichtet, sondern nur umgewandelt werden kann?",
        "options": [
          "Energieerhaltungssatz (1. Hauptsatz der Thermodynamik)",
          "Archimedisches Prinzip",
          "Goldene Regel der Mechanik",
          "Newtonsches Wechselwirkungsprinzip"
        ],
        "correct": 0,
        "explanation": "Der Energieerhaltungssatz ist eines der grundlegendsten Prinzipien der gesamten Physik."
      }
    ];

    function getRank(percentage) {
      if (percentage === 100) return { title: "🌟 Hervorragend!", icon: "🌟", msg: "Absolut fehlerfrei! Du hast dieses Thema perfekt gemeistert." };
      if (percentage >= 75)  return { title: "📚 Sehr gut!", icon: "📚", msg: "Starke Leistung! Du hast den Stoff super verstanden." };
      if (percentage >= 50)  return { title: "✏️ Solide Basis", icon: "✏️️", msg: "Guter Versuch! Die Grundlagen sitzen, aber ein kleiner Blick ins Skript hilft." };
      return { title: "🌱 Da geht noch mehr!", icon: "🌱", msg: "Kein Problem – schau dir die Erklärungen an und versuche es einfach noch einmal." };
    }

    let currentIndex = 0;
    let score = 0;

    function renderMath() {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function loadQuestion() {
      const q = quizData[currentIndex];
      document.getElementById('meta').textContent = `Aufgabe ${currentIndex + 1} von ${quizData.length}`;
      document.getElementById('question-text').innerHTML = q.question;
      document.getElementById('progress').style.width = `${(currentIndex / quizData.length) * 100}%`;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      q.options.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerHTML = optText;
        btn.onclick = () => selectOption(i, btn);
        container.appendChild(btn);
      });

      renderMath();
    }

    function selectOption(selectedIndex, clickedBtn) {
      const q = quizData[currentIndex];
      const buttons = document.querySelectorAll('.btn-option');
      buttons.forEach(b => b.disabled = true);

      const feedback = document.getElementById('feedback');
      const isCorrect = (selectedIndex === q.correct);

      if (isCorrect) {
        score++;
        document.getElementById('score-badge').textContent = `Punkte: ${score}`;
        clickedBtn.classList.add('correct');
        feedback.style.borderColor = 'var(--success)';
        feedback.style.backgroundColor = '#f0fdf4';
        feedback.innerHTML = `<strong style="color:var(--success)">Richtig! 🎉</strong><br><br>${q.explanation}`;
      } else {
        clickedBtn.classList.add('wrong');
        buttons[q.correct].classList.add('correct');
        feedback.style.borderColor = 'var(--error)';
        feedback.style.backgroundColor = '#fef2f2';
        feedback.innerHTML = `<strong style="color:var(--error)">Leider falsch.</strong><br>Die richtige Antwort ist: <em>${q.options[q.correct]}</em>.<br><br>${q.explanation}`;
      }

      feedback.style.display = 'block';
      const nextBtn = document.getElementById('next-btn');
      nextBtn.textContent = (currentIndex === quizData.length - 1) ? 'Ergebnis anzeigen 🎉' : 'Nächste Aufgabe →';
      nextBtn.style.display = 'block';

      renderMath();
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').style.display = 'none';
      const resultScreen = document.getElementById('result-screen');
      resultScreen.style.display = 'block';

      const pct = Math.round((score / quizData.length) * 100);
      const rank = getRank(pct);

      document.getElementById('badge-icon').textContent = rank.icon;
      document.getElementById('rank-display').textContent = rank.title;
      document.getElementById('score-display').innerHTML = `Du hast <strong>${score} von ${quizData.length}</strong> Aufgaben richtig gelöst (${pct}%).<br><br>${rank.msg}`;
    }

    window.addEventListener('DOMContentLoaded', loadQuestion);
  </script>
</body>
</html>
