<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetfeld-Simulation mit Dropdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 10px 0 5px 0;
            font-size: 22px;
        }
        .controls {
            margin-bottom: 10px;
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        label {
            font-size: 14px;
            margin-right: 8px;
            color: #ccc;
        }
        select {
            padding: 6px 12px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
        }
        canvas {
            display: block;
            background: #111;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <h1>Magnetfeld-Simulation</h1>
    
    <div class="controls">
        <label for="magnetSelect">Magnetform wählen:</label>
        <select id="magnetSelect">
            <option value="bar">Stabmagnet</option>
            <option value="doubleBar">Zwei Stabmagnete</option>
            <option value="horseshoe">Rechtwinkliger Hufeisenmagnet</option>
        </select>
    </div>

    <div id="canvas-container">
        <canvas id="simCanvas" width="800" height="480"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const magnetSelect = document.getElementById('magnetSelect');

        // Magnet-Objekt
        const magnet = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            angle: 0,
            type: 'bar',
            isDragging: false,
            offsetX: 0,
            offsetY: 0
        };

        magnetSelect.addEventListener('change', (e) => {
            magnet.type = e.target.value;
        });

        // Berechnet die Positionen der Pole für die jeweilige Magnetform
        function getPoles() {
            const cos = Math.cos(magnet.angle);
            const sin = Math.sin(magnet.angle);

            if (magnet.type === 'bar') {
                const dist = 45;
                return [
                    { x: magnet.x - dist * cos, y: magnet.y - dist * sin, sign: -1 }, // Südpol (Blau)
                    { x: magnet.x + dist * cos, y: magnet.y + dist * sin, sign: 1 }   // Nordpol (Rot)
                ];
            } else if (magnet.type === 'doubleBar') {
                // Zwei separate Stabmagnete übereinander
                const dist = 40;
                const offset = 30;
                return [
                    { x: magnet.x - dist * cos - offset * sin, y: magnet.y - dist * sin + offset * cos, sign: -1 },
                    { x: magnet.x + dist * cos - offset * sin, y: magnet.y + dist * sin + offset * cos, sign: 1 },
                    { x: magnet.x - dist * cos + offset * sin, y: magnet.y - dist * sin - offset * cos, sign: -1 },
                    { x: magnet.x + dist * cos + offset * sin, y: magnet.y + dist * sin - offset * cos, sign: 1 }
                ];
            } else {
                // Rechtwinkliger Hufeisenmagnet (U-Form aus Rechtecken)
                // Die Pole liegen an den beiden offenen Enden rechts
                const dX = 30;
                const dY = 35;
                return [
                    { x: magnet.x + (dX * cos - (-dY) * sin), y: magnet.y + (dX * sin + (-dY) * cos), sign: -1 }, // Südpol
                    { x: magnet.x + (dX * cos - (dY) * sin), y: magnet.y + (dX * sin + (dY) * cos), sign: 1 }    // Nordpol
                ];
            }
        }

        // Gitter für die kleinen Kompassnadeln im Hintergrund
        const needles = [];
        const spacing = 32;
        for (let x = spacing; x < canvas.width; x += spacing) {
            for (let y = spacing; y < canvas.height; y += spacing) {
                needles.push({ x: x, y: y });
            }
        }

        // Maus-Steuerung
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const dx = mouseX - magnet.x;
            const dy = mouseY - magnet.y;
            if (Math.sqrt(dx * dx + dy * dy) < 70) {
                magnet.isDragging = true;
                magnet.offsetX = dx;
                magnet.offsetY = dy;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!magnet.isDragging) return;
            const rect = canvas.getBoundingClientRect();
            magnet.x = e.clientX - rect.left - magnet.offsetX;
            magnet.y = e.clientY - rect.top - magnet.offsetY;
        });

        window.addEventListener('mouseup', () => {
            magnet.isDragging = false;
        });

        // Zeichenschleife
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const poles = getPoles();

            // 1. Kleine Kompassnadeln im Hintergrund zeichnen
            needles.forEach(n => {
                let Bx = 0;
                let By = 0;

                poles.forEach(pole => {
                    const dx = n.x - pole.x;
                    const dy = n.y - pole.y;
                    const dist2 = dx * dx + dy * dy;
                    const dist = Math.sqrt(dist2);

                    if (dist > 5) {
                        const force = pole.sign / (Math.pow(dist, 3) + 500);
                        Bx += dx * force;
                        By += dy * force;
                    }
                });

                const angle = Math.atan2(By, Bx);

                ctx.save();
                ctx.translate(n.x, n.y);
                ctx.rotate(angle);

                // Nordpol (Rot) / Südpol (Grau)
                ctx.fillStyle = '#ff4d4d';
                ctx.fillRect(0, -2, 9, 4);
                ctx.fillStyle = '#888888';
                ctx.fillRect(-9, -2, 9, 4);

                ctx.restore();
            });

            // 2. Ausgewählten Magneten zeichnen
            ctx.save();
            ctx.translate(magnet.x, magnet.y);
            ctx.rotate(magnet.angle);

            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;

            if (magnet.type === 'bar') {
                // Klassischer Stabmagnet
                ctx.fillStyle = '#2196F3'; // Süd (Blau)
                ctx.fillRect(-50, -18, 50, 36);
                ctx.fillStyle = '#F44336'; // Nord (Rot)
                ctx.fillRect(0, -18, 50, 36);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', -25, 0);
                ctx.fillText('N', 25, 0);

            } else if (magnet.type === 'doubleBar') {
                // Zwei Stabmagnete
                [-30, 30].forEach(offsetY => {
                    ctx.fillStyle = '#2196F3';
                    ctx.fillRect(-45, offsetY - 12, 45, 24);
                    ctx.fillStyle = '#F44336';
                    ctx.fillRect(0, offsetY - 12, 45, 24);

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('S', -22, offsetY);
                    ctx.fillText('N', 22, offsetY);
                });

            } else {
                // Rechtwinkliger Hufeisenmagnet (U-Form aus harten Ecken, Rot und Grün angemalt)
                // Verbindungsstück links (Grün oder neutral, wir machen es hier stilecht in Rot/Grün-Kombination)
                ctx.fillStyle = '#4CAF50'; // Grün für den Rücken
                ctx.fillRect(-45, -45, 20, 90);

                // Oberer Schenkel (Südpol - Blau/Grün-Mix oder nach Wunsch)
                ctx.fillStyle = '#2196F3'; 
                ctx.fillRect(-45, -45, 75, 20);

                // Unterer Schenkel (Nordpol - Rot)
                ctx.fillStyle = '#F44336'; 
                ctx.fillRect(-45, 25, 75, 20);

                // Beschriftung an den Polen (Enden rechts)
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', 20, -35);
                ctx.fillText('N', 20, 35);
            }

            ctx.restore();

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
