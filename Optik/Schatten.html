<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Simulation: Sehvorgang & Schattenräume</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 5px;
            color: #0f172a;
        }

        p.subtitle {
            color: #64748b;
            font-size: 1rem;
            margin-top: 0;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .canvas-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            position: relative;
        }

        canvas {
            display: block;
            cursor: crosshair;
            background: #ffffff;
            width: 100%;
            height: auto;
            max-width: 900px;
            aspect-ratio: 16 / 9;
        }

        .controls-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .info-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sehvorgang & Lichtstrahlmodell</h1>
        <p class="subtitle">Entdecke Punktlichtquelle, ausgedehnte Lichtquelle, Kern- und Halbschatten</p>
    </header>

    <div class="main-container">
        <!-- Simulation Canvas -->
        <div class="canvas-container">
            <canvas id="simCanvas" width="900" height="500"></canvas>
        </div>

        <!-- Bedienfeld -->
        <div class="controls-panel">
            <div class="control-group">
                <label>Art der Lichtquelle:</label>
                <div class="radio-group">
                    <label><input type="radio" name="sourceType" value="point" checked> Punktlicht</label>
                    <label><input type="radio" name="sourceType" value="extended"> Ausgedehnt</label>
                </div>
            </div>

            <div class="control-group">
                <label for="lightYSlider">Höhe der Lichtquelle:</label>
                <input type="range" id="lightYSlider" min="50" max="450" value="250">
            </div>

            <div class="control-group" style="justify-content: center;">
                <label class="checkbox-label">
                    <input type="checkbox" id="showRays" checked> Hilfslinien (Lichtstrahlen) anzeigen
                </label>
            </div>
        </div>

        <!-- Dynamischer Erklärungstext -->
        <div class="info-box" id="infoText">
            Wähle eine Lichtquelle und bewege sie, um zu sehen, wie sich Licht und Schatten auf dem Schirm verändern.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elemente
        const sourceTypeRadios = document.getElementsByName('sourceType');
        const lightYSlider = document.getElementById('lightYSlider');
        const showRaysCheckbox = document.getElementById('showRays');
        const infoText = document.getElementById('infoText');

        // Simulationsobjekte & Positionen
        let lightX = 150;
        let lightY = 250;
        const obstacleX = 450;
        const obstacleY = 250;
        const obstacleRadius = 40; // Kreis als Hindernis
        const screenX = 800;

        let isDragging = false;
        let sourceType = 'point'; // 'point' oder 'extended'
        let showRays = true;

        // Event Listener
        sourceTypeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                sourceType = e.target.value;
                updateInfo();
                draw();
            });
        });

        lightYSlider.addEventListener('input', (e) => {
            lightY = parseInt(e.target.value);
            draw();
        });

        showRaysCheckbox.addEventListener('change', (e) => {
            showRays = e.target.checked;
            draw();
        });

        // Maus-Steuerung für die Lichtquelle
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Prüfen, ob nah an der Lichtquelle geklickt wurde
            const dist = Math.hypot(mouseX - lightX, mouseY - lightY);
            if (dist < 40) {
                isDragging = true;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            let mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            let mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Begrenzung im Bereich
            lightX = Math.max(50, Math.min(300, mouseX));
            lightY = Math.max(50, Math.min(450, mouseY));
            lightYSlider.value = lightY;
            draw();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        function updateInfo() {
            if (sourceType === 'point') {
                infoText.innerHTML = "<strong>Punktlichtquelle:</strong> Sendet Licht von einem einzigen Punkt aus. Da Licht geradlinig verläuft, entsteht hinter dem Hindernis ein scharf abgegrenzter **Kernschatten** auf dem Schirm. Es gibt keinen Halbschatten.";
            } else {
                infoText.innerHTML = "<strong>Ausgedehnte Lichtquelle:</strong> Besteht aus vielen einzelnen Lichtpunkten (z. B. eine Röhre oder Glühbirne). Das führt dazu, dass Randbereiche des Schirms noch von *einem Teil* der Lichtquelle beleuchtet werden (**Halbschatten**), während die Mitte komplett dunkel bleibt (**Kernschatten**).";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Hintergrund-Schirm zeichnen
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(screenX, 50, 15, 400);
            ctx.fillStyle = '#64748b';
            ctx.font = '12px sans-serif';
            ctx.fillText('Schirm', screenX - 10, 40);

            // Schattenbereich auf dem Schirm berechnen und zeichnen
            drawShadowOnScreen();

            // 2. Hindernis (Kugel) zeichnen
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.arc(obstacleX, obstacleY, obstacleRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Gegenstand', obstacleX - 30, obstacleY - 50);

            // 3. Lichtstrahlen zeichnen (falls aktiviert)
            if (showRays) {
                drawRays();
            }

            // 4. Lichtquelle(n) zeichnen
            if (sourceType === 'point') {
                drawSingleLightSource(lightX, lightY);
            } else {
                // Ausgedehnte Lichtquelle (vertikaler Stab)
                const height = 80;
                const topY = lightY - height / 2;
                const bottomY = lightY + height / 2;
                drawSingleLightSource(lightX, topY);
                drawSingleLightSource(lightX, bottomY);
                
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(lightX, topY);
                ctx.lineTo(lightX, bottomY);
                ctx.stroke();
            }
        }

        function drawSingleLightSource(x, y) {
            // Gelber Glüheffekt
            const gradient = ctx.createRadialGradient(x, y, 2, x, y, 15);
            gradient.addColorStop(0, '#fef08a');
            gradient.addColorStop(1, 'rgba(234, 179, 8, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();

            // Kernpunkt
            ctx.fillStyle = '#eab308';
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawRays() {
            ctx.strokeStyle = 'rgba(234, 179, 8, 0.35)';
            ctx.lineWidth = 1.5;

            if (sourceType === 'point') {
                // Strahlen von Punktlicht vorbei an Kugel oben und unten
                const topAngle = Math.atan2((obstacleY - obstacleRadius) - lightY, obstacleX - lightX);
                const botAngle = Math.atan2((obstacleY + obstacleRadius) - lightY, obstacleX - lightX);

                // Ein paar Fächerstrahlen für die Visualisierung
                for (let a = -0.3; a <= 0.3; a += 0.08) {
                    const targetY = lightY + Math.tan(topAngle + a) * (screenX - lightX);
                    ctx.beginPath();
                    ctx.moveTo(lightX, lightY);
                    ctx.lineTo(screenX, targetY);
                    ctx.stroke();
                }
            } else {
                const height = 80;
                const topY = lightY - height / 2;
                const bottomY = lightY + height / 2;

                // Oberer Punkt der Lichtquelle zum oberen Hindernisrand
                drawRayLine(lightX, topY, obstacleX, obstacleY - obstacleRadius);
                // Oberer Punkt zum unteren Rand
                drawRayLine(lightX, topY, obstacleX, obstacleY + obstacleRadius);
                // Unterer Punkt zum oberen Rand
                drawRayLine(lightX, bottomY, obstacleX, obstacleY - obstacleRadius);
                // Unterer Punkt zum unteren Rand
                drawRayLine(lightX, bottomY, obstacleX, obstacleY + obstacleRadius);
            }
        }

        function drawRayLine(x1, y1, x2, y2) {
            const slope = (y2 - y1) / (x2 - x1);
            const targetY = y1 + slope * (screenX - x1);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(screenX, targetY);
            ctx.stroke();
        }

        function drawShadowOnScreen() {
            if (sourceType === 'point') {
                const topSlope = ((obstacleY - obstacleRadius) - lightY) / (obstacleX - lightX);
                const botSlope = ((obstacleY + obstacleRadius) - lightY) / (obstacleX - lightX);
                const screenTopShadowY = lightY + topSlope * (screenX - lightX);
                const screenBotShadowY = lightY + botSlope * (screenX - lightX);

                // Kernschatten auf Schirm
                ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
                ctx.fillRect(screenX, Math.min(screenTopShadowY, screenBotShadowY), 15, Math.abs(screenBotShadowY - screenTopShadowY));
            } else {
                const height = 80;
                const topY = lightY - height / 2;
                const bottomY = lightY + height / 2;

                // Schatten-Berechnung für ausgedehnte Quelle
                // 1. Tangenten von Oben(Licht) nach Unten(Hindernis) etc.
                const s1 = ((obstacleY - obstacleRadius) - bottomY) / (obstacleX - lightX);
                const yScreen1 = bottomY + s1 * (screenX - lightX);

                const s2 = ((obstacleY + obstacleRadius) - topY) / (obstacleX - lightX);
                const yScreen2 = topY + s2 * (screenX - lightX);

                const s3 = ((obstacleY - obstacleRadius) - topY) / (obstacleX - lightX);
                const yScreen3 = topY + s3 * (screenX - lightX);

                const s4 = ((obstacleY + obstacleRadius) - bottomY) / (obstacleX - lightX);
                const yScreen4 = bottomY + s4 * (screenX - lightX);

                const umbraTop = Math.max(yScreen3, yScreen1);
                const umbraBot = Math.min(yScreen4, yScreen2);

                // Halbschatten oben
                ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
                ctx.fillRect(screenX, Math.min(yScreen1, yScreen3), 15, Math.abs(umbraTop - Math.min(yScreen1, yScreen3)));

                // Halbschatten unten
                ctx.fillRect(screenX, umbraBot, 15, Math.abs(Math.max(yScreen2, yScreen4) - umbraBot));

                // Kernschatten (vollständig dunkel)
                if (umbraBot > umbraTop) {
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                    ctx.fillRect(screenX, umbraTop, 15, umbraBot - umbraTop);
                }
            }
        }

        // Initialisierung
        updateInfo();
        draw();
    </script>
</body>
</html>
