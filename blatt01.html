<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktives Quiz: /* QUIZ_TITLE */</title>
  
  <!-- MathJax fuer LaTeX Formeln -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --error: #dc2626;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      max-width: 600px;
      width: 100%;
    }

    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .score-badge {
      background: #fef3c7;
      color: #92400e;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .progress-bar-container {
      background: var(--border-color);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 25px;
    }
    
    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 20px;
      line-height: 1.5;
      color: var(--text-main);
    }

    .options-grid {
      display: grid;
      gap: 10px;
    }

    .btn-option {
      background: #f9fafb;
      border: 2px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 18px;
      font-size: 1rem;
      text-align: left;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-option:hover:not(:disabled) {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    .btn-option.correct {
      background: #f0fdf4 !important;
      border-color: var(--success) !important;
      color: #166534;
      font-weight: 600;
    }

    .btn-option.wrong {
      background: #fef2f2 !important;
      border-color: var(--error) !important;
      color: #991b1b;
    }

    .feedback-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #f9fafb;
      display: none;
      line-height: 1.5;
      font-size: 0.95rem;
      border-left: 4px solid var(--border-color);
    }

    .next-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: background 0.2s;
    }

    .next-btn:hover {
      background: var(--primary-hover);
    }

    .result-box {
      text-align: center;
      display: none;
    }
    
    .badge {
      font-size: 4rem;
      margin-bottom: 15px;
    }
    
    .rank-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 10px;
    }
    
    .score-text {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <div id="quiz-screen">
      <div class="header-info">
        <span id="meta">Aufgabe 1 / 4</span>
        <span id="score-badge" class="score-badge">Punkte: 0</span>
      </div>
      
      <div class="progress-bar-container">
        <div id="progress" class="progress-bar"></div>
      </div>

      <h2 id="question-text">Lade Fragen...</h2>
      
      <div id="options-container" class="options-grid"></div>
      
      <div id="feedback" class="feedback-box"></div>
      <button id="next-btn" class="next-btn" onclick="nextQuestion()">Nächste Aufgabe →</button>
    </div>

    <!-- Ergebnis-Bildschirm -->
    <div id="result-screen" class="result-box">
      <div id="badge-icon" class="badge">🎓</div>
      <div id="rank-display" class="rank-title">Laden...</div>
      <p id="score-display" class="score-text"></p>
      <button class="next-btn" style="display:inline-block;" onclick="location.reload()">Quiz wiederholen 🔄</button>
    </div>
  </div>

  <script>
    /* QUIZ_DATA_PLACEHOLDER */

    function getRank(percentage) {
      if (percentage === 100) return { title: "🌟 Perfekt!", icon: "🌟", msg: "Fantastische Leistung, du hast alles richtig!" };
      if (percentage >= 75)  return { title: "📚 Gut gemacht!", icon: "📚", msg: "Sehr solide Leistung, das Thema sitzt!" };
      if (percentage >= 50)  return { title: "✏️ Auf gutem Weg", icon: "✏️", msg: "Die Basis ist da, aber ein bisschen Übung schadet nicht." };
      return { title: "🌱 Weiter üben!", icon: "🌱", msg: "Schau dir die Aufgaben oder das Skript noch einmal in Ruhe an." };
    }

    let currentIndex = 0;
    let score = 0;

    function renderMath() {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function loadQuestion() {
      const q = quizData[currentIndex];
      document.getElementById('meta').textContent = `Aufgabe ${currentIndex + 1} von ${quizData.length}`;
      document.getElementById('question-text').innerHTML = q.question;
      document.getElementById('progress').style.width = `${(currentIndex / quizData.length) * 100}%`;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      q.options.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerHTML = optText;
        btn.onclick = () => selectOption(i, btn);
        container.appendChild(btn);
      });

      renderMath();
    }

    function selectOption(selectedIndex, clickedBtn) {
      const q = quizData[currentIndex];
      const buttons = document.querySelectorAll('.btn-option');
      buttons.forEach(b => b.disabled = true);

      const feedback = document.getElementById('feedback');
      const isCorrect = (selectedIndex === q.correct);

      if (isCorrect) {
        score++;
        document.getElementById('score-badge').textContent = `Punkte: ${score}`;
        clickedBtn.classList.add('correct');
        feedback.style.borderColor = 'var(--success)';
        feedback.style.backgroundColor = '#f0fdf4';
        feedback.innerHTML = `<strong style="color:var(--success)">Richtig! 🎉</strong><br><br>${q.explanation}`;
      } else {
        clickedBtn.classList.add('wrong');
        buttons[q.correct].classList.add('correct');
        feedback.style.borderColor = 'var(--error)';
        feedback.style.backgroundColor = '#fef2f2';
        feedback.innerHTML = `<strong style="color:var(--error)">Leider falsch.</strong><br>Die richtige Antwort ist: <em>${q.options[q.correct]}</em>.<br><br>${q.explanation}`;
      }

      feedback.style.display = 'block';
      const nextBtn = document.getElementById('next-btn');
      nextBtn.textContent = (currentIndex === quizData.length - 1) ? 'Ergebnis anzeigen 🎉' : 'Nächste Aufgabe →';
      nextBtn.style.display = 'block';

      renderMath();
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').style.display = 'none';
      const resultScreen = document.getElementById('result-screen');
      resultScreen.style.display = 'block';

      const pct = Math.round((score / quizData.length) * 100);
      const rank = getRank(pct);

      document.getElementById('badge-icon').textContent = rank.icon;
      document.getElementById('rank-display').textContent = rank.title;
      document.getElementById('score-display').innerHTML = `Du hast <strong>${score} von ${quizData.length}</strong> Aufgaben richtig gelöst (${pct}%).<br><br>${rank.msg}`;
    }

    window.addEventListener('DOMContentLoaded', loadQuestion);
  </script>
</body>
</html>
